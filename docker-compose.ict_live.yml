# ict_live — one command runs the whole live stack (service + feed + dashboard).
#
#   docker compose -f docker-compose.ict_live.yml up --build
#
# Then open the dashboard at http://127.0.0.1:8010  (live monitor: http://127.0.0.1:8000/report.html).
# Ctrl+C stops everything. Separate from the repo-root docker-compose.yml (mnq_system).
#
# Three services share one image:
#   live      — the frozen FastAPI live service (receives bars, produces signals/trades)
#   feed      — local yfinance feed bridge, so LIVE has real data with no TradingView/tunnel
#   dashboard — the LIVE + REPLAY browser UI (proxies `live`, runs replays on the mounted cache)

x-img: &img
  build:
    context: .
    dockerfile: Dockerfile.ict_live
  restart: unless-stopped

services:
  live:
    <<: *img
    environment:
      ICT_LIVE_HOST: 0.0.0.0          # must bind 0.0.0.0 inside the container
      ICT_LIVE_PORT: "8000"
      ICT_LIVE_DATA_DIR: /data        # persisted raw 1m + signal/trade logs
      ICT_LIVE_TOKEN: ${ICT_LIVE_TOKEN:-}   # optional; leave empty for local use
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}   # set both to get a Telegram alert on each new TAKE
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    command: ["python", "-m", "ict_live.live.serve"]
    ports:
      - "127.0.0.1:8000:8000"         # localhost only
    volumes:
      - ict_live_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).status==200 else sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # OPTIONAL delayed yfinance feed, fully inside Docker (no TradingView needed).
  # OFF by default (profile "sim"); enable with:  docker compose ... --profile sim up
  # For REAL-TIME data use the host-side MCP feed instead (./run-live.sh) — TradingView Desktop
  # is a GUI app and cannot run in a container.
  feed:
    <<: *img
    profiles: ["sim"]
    depends_on:
      live:
        condition: service_healthy
    command: ["python", "-m", "ict_live.live.feed_bridge",
              "--url", "http://live:8000", "--symbols", "MES", "MNQ"]

  dashboard:
    <<: *img
    depends_on:
      live:
        condition: service_healthy
    command: ["python", "-m", "ict_live.replay.dashboard",
              "--host", "0.0.0.0", "--port", "8010", "--live-url", "http://live:8000",
              "--v2-url", "http://v2:8020"]
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - ./cache:/app/cache:ro         # historical parquet cache -> the REPLAY tab

  # EXPERIMENTAL v2 (ICT 3-timeframe) — advisory side-car. READS the shared raw-1m store the v1
  # feed fills (read-only) and serves the v2 state to the dashboard's V2 tab. Never touches v1.
  v2:
    <<: *img
    environment:
      ICT_V2_DATA_DIR: /data
      ICT_V2_OUT_DIR: /out                               # writable — v2 trigger→outcome trade logs land here
      ICT_V2_HOST: 0.0.0.0
      ICT_V2_PORT: "8020"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}         # Telegram alert on each NEW armed scenario
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}             #   (both from .env; unset = alerts disabled)
      ICT_V2_NOTIFY_MAX_AGE_SEC: "${ICT_V2_NOTIFY_MAX_AGE_SEC:-600}"   # skip alerts older than this (warmup/frozen feed)
      # OPTIONAL MTF entry-refinement: set ICT_V2_REFINE=5m to refine the 1H entry FVG onto 5m
      # (fresh gaps for fast instruments). Empty = OFF (standard v2). Overridable from the host env.
      ICT_V2_REFINE: "${ICT_V2_REFINE:-}"
      ICT_V2_ANCHOR: "${ICT_V2_ANCHOR:-}"                 # Daily/Weekly context anchor (D/W); empty = OFF
      ICT_V2_ENTRY_MODELS: "${ICT_V2_ENTRY_MODELS:-}"     # execution models (default FVG only)
      # VALIDATION / TUNING knobs (NOT course methodology; faithful defaults = 2R / killzone on /
      # retrace on). Relax to see more signals while validating against charts:
      ICT_V2_MIN_RR: "${ICT_V2_MIN_RR:-}"                 # e.g. 1  (take/skip R:R floor)
      ICT_V2_KILLZONE: "${ICT_V2_KILLZONE:-}"             # off = don't require a killzone manipulation
      ICT_V2_REQUIRE_RETRACE: "${ICT_V2_REQUIRE_RETRACE:-}"  # off = armed setups read as TAKE (not WATCH)
      # cascade timeframes — validated MES edge uses the intraday config: SETUP_TF=15m CONFIRM_TF=5m
      ICT_V2_CONTEXT_TF: "${ICT_V2_CONTEXT_TF:-}"
      ICT_V2_SETUP_TF: "${ICT_V2_SETUP_TF:-}"
      ICT_V2_CONFIRM_TF: "${ICT_V2_CONFIRM_TF:-}"
      ICT_V2_TRIGGER_TF: "${ICT_V2_TRIGGER_TF:-}"
    command: ["python", "-m", "ict_v2.serve"]
    ports:
      - "127.0.0.1:8020:8020"
    volumes:
      - ict_live_data:/data:ro        # SAME store the live service writes — read-only
      - ./cache/v2out:/out            # writable — per-symbol trade logs (v2_trades_*.json) land on the host

volumes:
  ict_live_data:
